<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PV Structure Designer</title>
<!--
  PV Mounting Structure Designer — single-file static web app
  ------------------------------------------------------------
  Sections inside the <script type="module"> block:
    1. Code-parameter tables & reference data (cities, IS 875 tables, sections, modules)
    2. State (defaults, demo, persistence)
    3. Calculation engine (sun, layout, shading, wind, structure, foundations, energy, cost, BOM)
    4. Recommendations engine + Optimizer
    5. 3D scene builder (Three.js)
    6. UI (inputs, tabs, charts, reports)
  All code coefficients live in state.A ("Assumptions" tab) and are editable.
  Preliminary design tool — see disclaimer.
-->
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#f9fafb; --text:#1d2127; --muted:#5f6670; --faint:#8a919b;
  --border:#e2e5e9; --border-2:#d3d8de;
  --accent:#0f766e; --accent-2:#0d9488; --accent-weak:#e5f3f1; --accent-ink:#0b5b55;
  --ok:#15803d; --ok-bg:#e8f5ec; --warn:#b45309; --warn-bg:#fdf3e3; --fail:#b91c1c; --fail-bg:#fbeaea;
  --info:#1d4ed8; --info-bg:#eaf0fd;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3,h4{margin:0 0 .5em;line-height:1.25}
h3{font-size:15px} h4{font-size:13.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1.2em}
a{color:var(--accent)}
small,.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
/* ---------- top bar ---------- */
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border);z-index:40}
.brand{font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand .dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:7px;transform:translateY(-1px)}
.brand small{font-weight:400;margin-left:4px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--panel);padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-ink)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn.icon{padding:6px 9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.status-pill{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.status-pill.ok{background:var(--ok-bg);color:var(--ok);border-color:#bfe3cb}
.status-pill.warn{background:var(--warn-bg);color:var(--warn);border-color:#f3d7a7}
.status-pill.fail{background:var(--fail-bg);color:var(--fail);border-color:#f0c2c2}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:6px;min-width:240px;display:none;z-index:60}
.menu-pop.open{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu-pop button:hover{background:var(--panel-2)}
/* ---------- layout ---------- */
.app{flex:1;display:flex;min-height:0}
#sidebar{width:350px;flex:none;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);transition:width .2s,transform .2s}
#sidebar.collapsed{width:0;border-right:0}
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#viewWrap{position:relative;flex:0 0 50%;min-height:200px;background:#c9d6e3;overflow:hidden}
#view3d{position:absolute;inset:0}
#view3d canvas{display:block}
#splitter{height:7px;flex:none;cursor:row-resize;background:var(--border);position:relative}
#splitter::after{content:"";position:absolute;left:50%;top:2px;width:40px;height:3px;margin-left:-20px;border-radius:2px;background:var(--border-2)}
#kpis{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--border)}
#results{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);flex:none;padding:0 6px;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:11px;background:var(--fail);color:#fff;margin-left:4px}
.tabpanel{flex:1;overflow:auto;padding:14px 16px 40px}
footer.disclaimer{flex:none;font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border);padding:5px 12px;text-align:center}
/* ---------- sidebar inputs ---------- */
.side-head{position:sticky;top:0;background:var(--panel);z-index:2;padding:10px 12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.side-head b{flex:1}
details.sec{border-bottom:1px solid var(--border)}
details.sec>summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:600;display:flex;align-items:center;gap:8px;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--faint);transition:transform .15s;display:inline-block;width:10px}
details.sec[open]>summary::before{transform:rotate(90deg)}
.sec-body{padding:2px 14px 12px}
.fld{display:grid;grid-template-columns:1fr 128px;gap:2px 8px;align-items:center;margin:7px 0}
.fld>label{font-size:13px;color:#343a42}
.fld .ctl{display:flex;align-items:center;gap:4px}
.fld .ctl input[type=number],.fld .ctl input[type=text],.fld .ctl select{width:100%;padding:5px 7px;border:1px solid var(--border-2);border-radius:7px;background:#fff;min-width:0}
.fld .ctl input:focus,.fld .ctl select:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.fld .unit{font-size:11.5px;color:var(--faint);white-space:nowrap}
.fld.wide{grid-template-columns:1fr}
.fld.wide .ctl{width:100%}
.fld .hint{grid-column:1/-1;font-size:11.5px;color:var(--muted);line-height:1.35}
.fld .hint.warn{color:var(--warn)}
.fld.check{grid-template-columns:1fr auto}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:8px;overflow:hidden;width:100%}
.seg button{flex:1;border:0;background:#fff;padding:5px 6px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--accent);color:#fff}
.quick{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.quick button{border:1px solid var(--border-2);background:#fff;border-radius:6px;padding:1px 7px;font-size:11.5px;cursor:pointer}
.quick button.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-weak)}
.switch{position:relative;width:36px;height:20px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfd5dc;border-radius:20px;transition:.15s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.obs{border:1px solid var(--border);border-radius:8px;padding:8px;margin:8px 0;background:var(--panel-2)}
.obs-head{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.obs-head input{flex:1;padding:4px 6px;border:1px solid var(--border-2);border-radius:6px;min-width:0}
.obs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px}
.obs-grid label{font-size:11px;color:var(--muted);display:flex;flex-direction:column}
.obs-grid input,.obs-grid select{padding:3px 5px;border:1px solid var(--border-2);border-radius:6px;width:100%}
/* ---------- viewport overlays ---------- */
.vt{position:absolute;z-index:5;display:flex;gap:4px;flex-wrap:wrap}
.vt-left{left:8px;top:8px}
.vt-right{right:8px;top:8px;justify-content:flex-end;max-width:60%}
.vbtn{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.86);backdrop-filter:blur(6px);padding:5px 9px;border-radius:8px;cursor:pointer;font-size:12.5px;box-shadow:var(--shadow);white-space:nowrap}
.vbtn:hover{background:#fff}
.vbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sunbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);font-size:12.5px}
.sunbar label{display:flex;align-items:center;gap:6px;flex:1;min-width:170px}
.sunbar input[type=range]{flex:1;accent-color:var(--accent)}
.sunbar .readout{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.member-pop{position:absolute;z-index:8;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.18);padding:10px 12px;font-size:12.5px;min-width:220px;max-width:300px;pointer-events:auto}
.member-pop h4{margin:0 0 4px;text-transform:none;letter-spacing:0;color:var(--text);font-size:13.5px}
.member-pop table{border-collapse:collapse;width:100%}
.member-pop td{padding:2px 0;vertical-align:top}
.member-pop td:first-child{color:var(--muted);padding-right:8px}
.view-msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);z-index:3}
.view-msg.show{display:flex}
.dimlabel{font:600 11.5px/1.2 system-ui,sans-serif;color:#0b2530;background:rgba(255,255,255,.9);padding:2px 6px;border-radius:5px;border:1px solid rgba(15,118,110,.35);white-space:nowrap;pointer-events:none}
.dimlabel.load{color:#7f1d1d;border-color:rgba(185,28,28,.4)}
.dimlabel.tag{color:#334;font-weight:500}
.pres-overlay{display:none;position:absolute;left:16px;top:16px;z-index:9;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:14px;padding:14px 18px;box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:340px}
.pres-overlay h2{font-size:18px;margin:0 0 2px}
.pres-overlay .pk{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:10px}
.pres-overlay .pk b{display:block;font-size:20px;letter-spacing:-.01em}
.pres-overlay .pk span{font-size:12px;color:var(--muted)}
#viewWrap.presenting .pres-overlay{display:block}
#viewWrap.presenting .vt-left,#viewWrap.presenting .sunbar{opacity:.0;transition:opacity .3s}
#viewWrap.presenting:hover .vt-left,#viewWrap.presenting:hover .sunbar{opacity:1}
/* ---------- KPI cards ---------- */
.kpi{flex:none;min-width:118px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 11px;box-shadow:var(--shadow)}
.kpi .v{font-size:17px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.kpi .l{font-size:11.5px;color:var(--muted);white-space:nowrap}
.kpi.ok{border-color:#bfe3cb;background:var(--ok-bg)} .kpi.warn{border-color:#f3d7a7;background:var(--warn-bg)} .kpi.fail{border-color:#f0c2c2;background:var(--fail-bg)}
/* ---------- result content ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.card.flat{background:var(--panel-2)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.t th{font-weight:600;color:var(--muted);font-size:12px;background:var(--panel-2);position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.sub td{background:var(--panel-2);font-weight:600}
table.t tr.tot td{font-weight:650;border-top:2px solid var(--border-2)}
.tw{overflow-x:auto}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.warn{background:var(--warn-bg);color:var(--warn)} .st.fail{background:var(--fail-bg);color:var(--fail)} .st.info{background:var(--info-bg);color:var(--info)}
.ubar{display:inline-block;width:56px;height:6px;border-radius:3px;background:#eceff2;vertical-align:middle;margin-right:6px;overflow:hidden}
.ubar i{display:block;height:100%;border-radius:3px}
.formula{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;line-height:1.55;overflow-x:auto}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--border-2);padding:2px 0 2px 10px;margin:8px 0}
.simp{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:#7c4a03;background:#fdf0d5;border:1px solid #f1d39a;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px;cursor:help}
.warnbox{border:1px solid #f3d7a7;background:var(--warn-bg);color:#6b3a07;border-radius:10px;padding:8px 12px;margin:0 0 12px}
.warnbox.fail{border-color:#f0c2c2;background:var(--fail-bg);color:#7f1d1d}
.warnbox ul{margin:4px 0 0 18px;padding:0}
.rec{border:1px solid var(--border);border-left:4px solid var(--border-2);border-radius:8px;padding:9px 12px;margin:8px 0;background:var(--panel)}
.rec.Critical{border-left-color:var(--fail)} .rec.Recommended{border-left-color:var(--warn)} .rec.Optional{border-left-color:var(--info)}
.rec .rt{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rec .rd{font-size:13px;color:#3b424b;margin-top:3px}
.rec .ri{font-size:12.5px;margin-top:4px;color:var(--accent-ink);font-weight:600}
.pri{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.pri.Critical{background:var(--fail-bg);color:var(--fail)} .pri.Recommended{background:var(--warn-bg);color:var(--warn)} .pri.Optional{background:var(--info-bg);color:var(--info)}
.cat{font-size:11.5px;color:var(--muted);font-weight:500}
.chart{position:relative;width:100%}
.chart canvas{width:100%;display:block}
.chart-title{font-weight:600;font-size:13px;margin:0 0 4px}
.chart-sub{font-size:12px;color:var(--muted);margin:-2px 0 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.sq{height:10px;width:10px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(16,24,40,.14);padding:6px 9px;font-size:12px;white-space:nowrap;z-index:5;display:none}
.tip b{font-variant-numeric:tabular-nums}
.plan svg{width:100%;height:auto;display:block;background:#fbfcfd;border:1px solid var(--border);border-radius:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){font-variant-numeric:tabular-nums}
.asm input{width:76px;padding:3px 5px;border:1px solid var(--border-2);border-radius:5px;font-size:12.5px;text-align:right}
.asm input.wide{width:150px;text-align:left}
.asm select{padding:3px 5px;border:1px solid var(--border-2);border-radius:5px;font-size:12.5px}
.asm table.t td{padding:3px 6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill-tabs{display:inline-flex;border:1px solid var(--border-2);border-radius:8px;overflow:hidden}
.pill-tabs button{border:0;background:#fff;padding:5px 10px;cursor:pointer;font-size:12.5px}
.pill-tabs button.on{background:var(--accent);color:#fff}
.cmp td.better{color:var(--ok);font-weight:600} .cmp td.worse{color:var(--fail);font-weight:600}
.progress{height:6px;background:#eceff2;border-radius:3px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,20,25,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal-card{background:var(--panel);border-radius:14px;max-width:920px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-card.wide{max-width:1100px;max-height:94vh}
.modal-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{flex:1;margin:0}
#modalBody{padding:14px 16px;overflow:auto}
#printArea{display:none}
/* ---------- responsive ---------- */
@media (max-width: 900px){
  body{overflow:auto;height:auto;min-height:100%}
  .app{flex-direction:column}
  #sidebar{position:fixed;left:0;top:52px;bottom:0;z-index:50;width:min(92vw,380px);transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.25)}
  #sidebar.open{transform:none}
  #sidebar.collapsed{width:min(92vw,380px)}
  #viewWrap{flex:none;height:52vh;min-height:300px}
  #splitter{display:none}
  #results{flex:none;min-height:70vh}
  .tabpanel{overflow:visible}
  .brand small,.hide-sm{display:none}
  .vt-right{top:44px;left:8px;right:auto;justify-content:flex-start;max-width:none}
  .fld{grid-template-columns:1fr 120px}
  #statusPill{display:none}
}
@media (max-width: 520px){
  .brand{font-size:0} .brand .dot{margin-right:0}
  .topbar{gap:6px;padding:0 8px}
  .topbar .btn{padding:6px 8px}
  .vbtn{padding:4px 7px;font-size:11.5px}
  .sunbar{font-size:11.5px}
  .grid2{grid-template-columns:1fr}
}
/* ---------- print ---------- */
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{display:block;overflow:visible;height:auto;background:#fff;font-size:11.5px}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .rep h1{font-size:20px;margin:0 0 4px} .rep h2{font-size:15px;margin:16px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px;break-after:avoid}
  .rep h3{font-size:13px;break-after:avoid}
  .rep .card,.rep table,.rep .formula,.rep .rec{break-inside:avoid}
  .rep table.t th{position:static}
  .rep .formula{font-size:10.5px}
  .rep .disc{border:1px solid #999;padding:6px 10px;margin:10px 0;font-size:11px}
  .rep .chart canvas,.rep img.chartimg{max-width:100%}
  .rep .pb{break-before:page}
  .rep .tw{overflow:visible} .rep table.t{font-size:10px} .rep table.t th,.rep table.t td{padding:3px 5px}
  .rep .grid2{grid-template-columns:1fr 1fr}
}
.rep{max-width:1000px;margin:0 auto}
.rep .cover{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:10px}
.rep .snap{width:100%;border-radius:10px;border:1px solid var(--border)}
.rep .big{font-size:26px;font-weight:700;letter-spacing:-.01em}
.rep .disc{border:1px solid var(--border-2);border-radius:8px;padding:6px 10px;margin:10px 0;font-size:12px;color:#444;background:#fafafa}
</style>

<body>
<header class="topbar">
  <button class="btn icon" id="btnSidebar" title="Show / hide inputs" aria-label="Toggle inputs">☰</button>

/* ---------- Section library (properties computed from dimensions, then editable) ----------
 * Thin-walled centre-line formulae; corner radii neglected [SIMPLIFIED] (A, I within ~3–5 %).
 * Units: dimensions mm, A mm², I mm⁴, Z mm³, r mm, Av (shear area) mm², kg/m. */
function secLippedC(h, b, d, t) {               // IS 811 cold-formed lipped channel
  const hc = h - t, bc = b - t, dc = d - t / 2;
  const A = t * (hc + 2 * bc + 2 * dc);
  const Ix = t * hc ** 3 / 12 + 2 * bc * t * (hc / 2) ** 2 + 2 * (t * dc ** 3 / 12 + dc * t * (hc / 2 - dc / 2) ** 2);
  const xb = (2 * bc * t * (bc / 2) + 2 * dc * t * bc) / A;
  const Iy = hc * t * xb ** 2 + 2 * (t * bc ** 3 / 12 + bc * t * (bc / 2 - xb) ** 2) + 2 * dc * t * (bc - xb) ** 2;
  return { A, Ix, Iy, Zx: Ix / (h / 2), Av: h * t };
}
function secBox(B, H, t) {                      // IS 4923 SHS/RHS (H = depth in bending plane)
  const A = B * H - (B - 2 * t) * (H - 2 * t);
  const Ix = (B * H ** 3 - (B - 2 * t) * (H - 2 * t) ** 3) / 12;
  const Iy = (H * B ** 3 - (H - 2 * t) * (B - 2 * t) ** 3) / 12;
  return { A, Ix, Iy, Zx: Ix / (H / 2), Av: 2 * H * t };
}
function secCHS(D, t) {                         // IS 1161 / IS 4923 circular hollow section
  const di = D - 2 * t, A = Math.PI / 4 * (D * D - di * di), I = Math.PI / 64 * (D ** 4 - di ** 4);
  return { A, Ix: I, Iy: I, Zx: I / (D / 2), Av: 2 * A / Math.PI };
}
function secAngle(b, t) {                       // IS 808 equal angle — min. principal axis (v-v)
  const A = t * (2 * b - t);
  const c = (b * t * (b / 2) + (b - t) * t * (t / 2)) / A;
  const Ixx = t * b ** 3 / 12 + b * t * (b / 2 - c) ** 2 + (b - t) * t ** 3 / 12 + (b - t) * t * (t / 2 - c) ** 2;
  const Ixy = b * t * (t / 2 - c) * (b / 2 - c) + (b - t) * t * ((b + t) / 2 - c) * (t / 2 - c);
  const Iv = Ixx - Math.abs(Ixy);
  return { A, Ix: Ixx, Iy: Iv, Zx: Ixx / (b - c), Av: b * t };
}

function buildSectionLibrary() {
  return SECTION_DEFS.map(([fam, d, mat, roles]) => {
    let p, name, h, b, shape;
    if (fam === 'C')   { p = secLippedC(...d); name = `C ${d[0]}×${d[1]}×${d[2]}×${d[3].toFixed(1)}`; h = d[0]; b = d[1]; shape = 'box'; }
    if (fam === 'RHS') { p = secBox(d[0], d[1], d[2]); name = `RHS ${d[1]}×${d[0]}×${d[2]}`; h = d[1]; b = d[0]; shape = 'box'; }
    if (fam === 'SHS') { p = secBox(d[0], d[1], d[2]); name = `SHS ${d[0]}×${d[1]}×${d[2]}`; h = d[1]; b = d[0]; shape = 'box'; }
    if (fam === 'CHS') { p = secCHS(d[0], d[1]); name = `CHS ${d[0]}×${d[1]}`; h = d[0]; b = d[0]; shape = 'cyl'; }
    if (fam === 'L')   { p = secAngle(d[0], d[1]); name = `ISA ${d[0]}×${d[0]}×${d[1]}`; h = d[0]; b = d[0]; shape = 'box'; }
    if (fam === 'AL')  { p = secBox(d[0], d[1], d[2]); name = `Al rail/box ${d[1]}×${d[0]}×${d[2]}`; h = d[1]; b = d[0]; shape = 'box'; }
    const rho = mat === 'al' ? 2700 : 7850;
    const rmin = Math.sqrt(Math.min(p.Ix, p.Iy) / p.A);
    const id = (fam + '_' + d.join('x')).replace(/\./g, 'p');
    return { id, fam, name, mat, roles, h, b, shape,
      A: +p.A.toFixed(1), Ix: Math.round(p.Ix), Zx: Math.round(p.Zx), rmin: +rmin.toFixed(2), Av: +p.Av.toFixed(1),
      kgm: +(p.A * 1e-6 * rho).toFixed(3) };
  });
}

/* =====================================================================================

function setCam(kind, instant) {
  if (!V.ready || !V.focus) return;
  const a = S.system.azimuth * D2R, f = [Math.sin(a), 0, -Math.cos(a)], side = [Math.cos(a), 0, Math.sin(a)];

  const to = new THREE.Vector3(...p);
  if (instant) { V.camera.position.copy(to); V.controls.target.copy(c); V.controls.update(); return; }
  V.tween = { t0: performance.now(), from: V.camera.position.clone(), to, tf: V.controls.target.clone(), tt: c.clone() };

function pick3D(ev) {
  if (!V.ready || !V.pick.length) return;

  const m = new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(m, V.camera);
  const meshes = V.pick.map(p => p.mesh).filter(o => o.visible && (o.parent && o.parent.visible !== false));
  const hits = rc.intersectObjects(meshes, false);
  const pop = document.getElementById('memberPop');
  if (!hits.length) { pop.hidden = true; return; }
  const h = hits[0], p = V.pick.find(q => q.mesh === h.object), info = p.info[h.instanceId];
  const R0 = V.R, rows = [];
  if (info.kind === 'member') {
    const mm = info.m, roleN = { purlin: R0.struct.system === 'flush' ? 'Mounting rail' : 'Purlin', rafter: 'Rafter', column: 'Column / leg', brace: mm.xb ? 'Longitudinal X-brace' : (R0.struct.portal ? 'Knee brace' : 'Frame diagonal') }[mm.role];

    pop.innerHTML = `<h4>${roleN}</h4><table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
  } else if (info.kind === 'module') {

    pop.innerHTML = `<h4>Table #${t.id} — ${ZONE_NAMES[t.zone]} zone</h4><table><tr><td>Modules</td><td>${t.nr}${R0.P.orient} × ${t.nc} = ${t.nr * t.nc}</td></tr><tr><td>Capacity</td><td>${(t.nr * t.nc * R0.S.module.Wp / 1000).toFixed(2)} kWp</td></tr><tr><td>Row / position</td><td>${t.row + 1} / ${t.col + 1}</td></tr><tr><td>Winter shading</td><td>${(t.ws.avg * 100).toFixed(1)} %</td></tr>${t.over ? `<tr><td>Spans over</td><td>${t.over}</td></tr>` : ''}</table>`;
  } else {

  }
  const wr = document.getElementById('viewWrap').getBoundingClientRect();

  pop.style.left = Math.min(ev.clientX - wr.left + 12, wr.width - 310) + 'px';

      s += `<rect x="${X(b.x0)}" y="${Z(b.z0)}" width="${o.w * sc}" height="${o.d * sc}" fill="#9aa1ab" rx="${o.type === 'tank' ? o.w * sc / 2 : 2}"/>`;
      s += `<text x="${X(b.x0 + o.w / 2)}" y="${Z(b.z0 + o.d / 2) + 4}" text-anchor="middle" fill="#fff" font-weight="600">${esc(o.name.split(' ')[0])} ${o.h} m</text>`;
    }
  } else {
    s += `<rect x="${X(-Lr / 2)}" y="${Z(0)}" width="${Lr * sc}" height="${Wr * sc}" fill="#e3e8ee" stroke="#9aa1ab"/>`;
    s += `<text x="${X(0)}" y="${Z(0) - 6}" text-anchor="middle" fill="#5f6670">Ridge</text><text x="${X(0)}" y="${Z(Wr) + 14}" text-anchor="middle" fill="#5f6670">Eave — south slope shown in true length</text>`;
  }
  for (const t of L.tables) {
    let x0, x1, z0, z1;
    if (flush) { const p = t.part; x0 = p.x0; x1 = p.x1; z0 = Wr - (p.s0 + L.td.Ls); z1 = Wr - p.s0; }
    else ({ x0, x1, z0, z1 } = t.fp);
    s += `<rect x="${X(x0)}" y="${Z(z0)}" width="${(x1 - x0) * sc}" height="${(z1 - z0) * sc}" fill="${zc[t.zone]}" stroke="#2f4858" stroke-width="1"/>`;
    // module grid lines
    const alongX = t.face === 'S' || t.face === 'F';
    for (let j = 1; j < t.nc; j++) { if (alongX) { const x = x0 + j * (x1 - x0) / t.nc; s += `<line x1="${X(x)}" y1="${Z(z0)}" x2="${X(x)}" y2="${Z(z1)}" stroke="#2f4858" stroke-opacity=".35"/>`; } else { const z = z0 + j * (z1 - z0) / t.nc; s += `<line x1="${X(x0)}" y1="${Z(z)}" x2="${X(x1)}" y2="${Z(z)}" stroke="#2f4858" stroke-opacity=".35"/>`; } }
    for (let r = 1; r < t.nr; r++) { if (alongX) { const z = z0 + r * (z1 - z0) / t.nr; s += `<line x1="${X(x0)}" y1="${Z(z)}" x2="${X(x1)}" y2="${Z(z)}" stroke="#2f4858" stroke-opacity=".35"/>`; } else { const x = x0 + r * (x1 - x0) / t.nr; s += `<line x1="${X(x)}" y1="${Z(z0)}" x2="${X(x)}" y2="${Z(z1)}" stroke="#2f4858" stroke-opacity=".35"/>`; } }
    if (t.ws && t.ws.avg > 0) s += `<rect x="${X(x0)}" y="${Z(z0)}" width="${(x1 - x0) * sc}" height="${(z1 - z0) * sc}" fill="url(#hatch)" opacity=".55"/>`;
    s += `<text x="${X((x0 + x1) / 2)}" y="${Z((z0 + z1) / 2) + 4}" text-anchor="middle" font-weight="700" fill="#1d2127">T${t.id}</text>`;
  }
  // facing arrow & north arrow
  if (!flush) {
    s += `<g transform="translate(${X(Lr / 2) + 0.2 * sc},${Z(Wr / 2) + 0.9 * sc})"><text x="0" y="0" text-anchor="end" fill="#0f766e" font-weight="600">modules face ↓ (azimuth ${S.system.azimuth}°)</text></g>`;
    s += `<text x="${X(-Lr / 2)}" y="${Z(-Wr / 2) - 0.45 * sc}" fill="#5f6670">${Lr.toFixed(2)} m × ${Wr.toFixed(2)} m (inside parapet)</text>`;
  }
  const nl = toLocal([0, 0, -1], S.system.azimuth), cx = 600 - 26, cy = 26;
  s += `<g><circle cx="${cx}" cy="${cy}" r="16" fill="#fff" stroke="#c9ced4"/><line x1="${cx}" y1="${cy}" x2="${cx + nl[0] * 12}" y2="${cy + nl[2] * 12}" stroke="#b91c1c" stroke-width="2.5"/><text x="${cx + nl[0] * 22}" y="${cy + nl[2] * 22 + 4}" text-anchor="middle" font-weight="700" fill="#b91c1c">N</text></g>`;
  s += '</svg>';
  return s;
}

      ['Roof / plot area', nf(L.roofArea, 1) + ' m²'], ['Usable area', nf(L.usableArea, 1) + ' m² (after setbacks, keep-outs)'], ['Array footprint', nf(L.footprint, 1) + ' m²'],
      ['Fits (max.)', `${L.fitModules} modules = ${nf(L.fitModules * S.module.Wp / 1000, 2)} kWp`],

      ['Target', S.system.target > 0 ? `${S.system.target} kWp → ${L.Nneed} modules${L.nModules < L.Nneed ? ' <b style="color:var(--fail)">(shortfall)</b>' : ` (surplus ${nf(R.kWp - S.system.target, 2)} kWp)`}` : 'maximum fit'],

g_shade = ${nf(L.gapShade, 3)} m → gap = max(g_shade, walkway ${I.walkway}) = ${nf(L.gap, 2)} m;  pitch = L_s·cos β + gap = ${nf(td.D, 3)} + ${nf(L.gap, 3)} = ${nf(L.pitch, 3)} m

function tabEnergy(R) {

  html += `<div class="grid2" style="margin-top:14px"><div class="card"><h3>Loss breakdown ${SIMP('Fixed percentage losses; temperature loss from monthly cell temperature (Ross model).')}</h3><table class="t"><tr><th>Step</th><th class="n">Loss</th><th class="n">Energy after step</th></tr>
    ${E.waterfall.map((w, i) => `<tr${i === 0 ? ' class="sub"' : ''}><td>${esc(w.name)}</td><td class="n">${w.pct == null ? '' : (w.pct < 0 ? '+' + nf(-w.pct, 1) : '−' + nf(w.pct, 1)) + ' %'}</td><td class="n">${nf(w.kwh)} kWh</td></tr>`).join('')}
    <tr class="tot"><td>Net AC energy · performance ratio</td><td class="n">PR ${nf(E.PR, 3)}</td><td class="n">${nf(E.annual)} kWh</td></tr></table></div>
    <div class="card"><h3>Monthly values</h3><div class="tw"><table class="t"><tr><th>Month</th><th class="n">GHI kWh/m²/d</th><th class="n">K_T</th><th class="n">POA kWh/m²/d</th><th class="n">T_amb °C</th><th class="n">T_cell °C</th><th class="n">Temp. loss</th><th class="n">Shade</th><th class="n">kWh</th></tr>

Legs at u_f = ${nf(g.uf, 3)} m and u_r = ${nf(g.ur, 3)} m (plan), d = ${nf(g.d, 3)} m; leg heights h_f = ${nf(g.hf, 2)} m, h_r = ${nf(g.hr, 2)} m
R_rear = [(u_cp − u_f)·F_v + y_cp·F_H] / d ;  R_front = F_v − R_rear   (rigid frame, horizontal force at the panel centre of pressure)</div>

function bomCSV(R) {

/** In the hosted (Claude artifact) build, file downloads are blocked → offer copy / save-image instead. */
const HOSTED = window.__PV_HOSTED === true;
function download(name, data, type) {
  if (HOSTED) {
    if (String(data).startsWith('data:image')) {
      openModal('Save image', `<p>Right-click the image (long-press on a phone) and choose <b>Save image as…</b> — file name suggestion: <span class="mono">${esc(name)}</span>.</p><img src="${data}" alt="3D view" style="width:100%;border-radius:8px;border:1px solid var(--border)">`);
    } else {
      openModal('Copy ' + name, `<p>Downloads are not available inside Claude. Copy the text below and save it as <span class="mono">${esc(name)}</span> (for a design file, use <b>Design ▾ → Import design</b> to load it again).</p>
        <div class="toolbar"><button class="btn accent" id="btnCopyTxt">Copy to clipboard</button><span class="muted" id="copyMsg"></span></div>
        <textarea id="copyTxt" readonly style="width:100%;height:46vh;font-family:var(--mono);font-size:12px;border:1px solid var(--border-2);border-radius:8px;padding:8px">${esc(data)}</textarea>`);
      $('#btnCopyTxt').onclick = () => {
        const ta = $('#copyTxt');
        navigator.clipboard.writeText(ta.value).then(() => { $('#copyMsg').textContent = 'Copied.'; })
          .catch(() => { ta.focus(); ta.select(); $('#copyMsg').textContent = 'Text selected — press Ctrl+C to copy.'; });
      };
    }
    return;
  }
  const a = document.createElement('a');
  a.href = data.startsWith && data.startsWith('data:') ? data : URL.createObjectURL(new Blob([data], { type }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { if (!data.startsWith('data:')) URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- Modal, in-page confirmation (browser confirm()/alert() are not used) ---------- */
function openModal(title, html, wide) { $('#modalTitle').textContent = title; $('#modalBody').innerHTML = html; $('.modal-card').classList.toggle('wide', !!wide); $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; if (closeModal.onClose) { const f = closeModal.onClose; closeModal.onClose = null; f(); } }
function confirmBox(message, okLabel) {
  return new Promise(res => {
    openModal('Please confirm', `<p>${esc(message)}</p><div class="toolbar" style="justify-content:flex-end"><button class="btn" id="cfNo">Cancel</button><button class="btn accent" id="cfYes">${esc(okLabel || 'OK')}</button></div>`);
    let done = false; const fin = v => { if (done) return; done = true; closeModal.onClose = null; closeModal(); res(v); };
    closeModal.onClose = () => { if (!done) { done = true; res(false); } };
    $('#cfYes').onclick = () => fin(true); $('#cfNo').onclick = () => fin(false); $('#cfYes').focus();
  });
}
function messageBox(title, message) { openModal(title, `<p>${esc(message)}</p>`); }
async function openOptimizer() {
  if (!R) return;
  openModal('Optimize design', `<p>Searching tilt × orientation × table size with automatic section selection… <span class="muted">(${S.install.foundation ? esc(FOUNDS[S.install.foundation]) : ''} and material kept)</span></p><div class="progress"><i id="optBar"></i></div><p class="muted" id="optTxt">Starting…</p>`);
  await new Promise(r => setTimeout(r, 30));
  const res = await runOptimizer(S, p => { const b = $('#optBar'); if (b) b.style.width = (p * 100).toFixed(0) + '%'; const t = $('#optTxt'); if (t) t.textContent = `${(p * 100).toFixed(0)} % evaluated`; });
  if (!res.best) { $('#modalBody').innerHTML = `<p>No feasible alternative found among ${res.evaluated} combinations (all checks passing${S.system.target > 0 ? ' and target capacity met' : ''}). Try another foundation type, reduce the target, or adjust assumptions.</p>`; return; }
  const b = res.base, a = res.best.r;
  const row = (lbl, f, fmt, better) => { const vb = f(b), va = f(a); const cls = better == null || vb === va ? '' : (better === 'high' ? va > vb : va < vb) ? 'better' : 'worse'; return `<tr><td>${lbl}</td><td class="n">${fmt(vb)}</td><td class="n ${cls}">${fmt(va)}</td></tr>`; };
  const upl = r => r.struct ? Math.abs(r.cp.up) * zoneFactor(S.A, r.struct.zGov) * r.wind.pdTg * r.layout.td.Ls * r.layout.td.Wt : 0;
  const foundTxt = r => { if (!r.struct || !r.struct.found) return '—'; const f = r.struct.found[r.struct.zGov]; if (!f) return '—'; if (f.ballast) return f.ballast.kg + ' kg ballast/table'; const l = f.legs.reduce((x, y) => ((y.ped ? y.ped.kg : 0) > (x.ped ? x.ped.kg : 0) ? y : x)); return l.ped ? `pedestal ${nf(l.ped.kg)} kg` : l.anch ? `${l.anch.nReq} anchors/base` : l.pile ? `pile ${nf(l.pile.Lreq, 1)} m` : '—'; };
  const html = `<p>Evaluated <b>${res.evaluated}</b> combinations, <b>${res.feasibleCount}</b> feasible (all checks ≤ 100 %${S.system.target > 0 ? ', target met' : ''}). Score = 25-year discounted energy value − capex (modules/BOS per Wp + steel + civil).</p>
    <div class="tw"><table class="t cmp"><tr><th>Metric</th><th class="n">Current</th><th class="n">Optimized</th></tr>
      ${row('Tilt', r => r.layout.tilt, v => nf(v, 0) + '°')}
      ${row('Orientation × table', r => `${r.P.nr}${r.P.orient} × ${r.P.nc}`, v => v)}
      ${row('Modules / capacity', r => r.kWp, v => nf(v, 2) + ' kWp', 'high')}
      ${row('Annual energy', r => r.energy.annual, v => nf(v) + ' kWh', 'high')}
      ${row('Specific yield', r => r.energy.SY, v => nf(v) + ' kWh/kWp', 'high')}
      ${row('Structure mass', r => r.bom.steelKg + r.bom.alKg, v => nf(v) + ' kg', 'low')}
      ${row('Steel intensity', r => r.loads.kgPerKWp, v => nf(v) + ' kg/kWp', 'low')}
      ${row('Uplift per table (gov. zone)', upl, v => nf(v, 1) + ' kN', 'low')}
      ${row('Foundation (gov. zone)', foundTxt, v => v)}
      ${row('Max utilisation', r => r.maxUtil, v => pct(v), 'low')}
      ${row('Score (₹, NPV proxy)', r => (r === b ? res.baseScore : res.best.sc), v => v == null ? '—' : inrShort(v), 'high')}
    </table></div>${res.baseFeasible ? '' : '<p class="warnbox fail" style="margin-top:10px">The current design is not feasible (failing checks or target not met).</p>'}
    <h4>Top alternatives</h4><table class="t"><tr><th>#</th><th>Tilt</th><th>Table</th><th class="n">kWp</th><th class="n">kWh/yr</th><th class="n">Steel kg</th><th class="n">Max util.</th><th class="n">Score</th><th></th></tr>
    ${res.top.map((x, i) => `<tr><td>${i + 1}</td><td>${x.t}°</td><td>${x.nr}${x.o} × ${x.nc}</td><td class="n">${nf(x.r.kWp, 2)}</td><td class="n">${nf(x.r.energy.annual)}</td><td class="n">${nf(x.r.bom.steelKg + x.r.bom.alKg)}</td><td class="n">${pct(x.r.maxUtil)}</td><td class="n">${inrShort(x.sc)}</td><td><button class="btn sm ${i === 0 ? 'accent' : ''}" data-apply="${i}">Apply</button></td></tr>`).join('')}</table>`;
  $('#modalBody').innerHTML = html;
  $$('#modalBody [data-apply]').forEach(btn => btn.onclick = () => {
    const x = res.top[+btn.dataset.apply];
    Object.assign(S.system, { tiltMode:'manual', tilt:x.t, frameSpacing:0, sections:{ purlin:'auto', rafter:'auto', column:'auto', brace:'auto' } });
    Object.assign(S.module, { orient:x.o, nr:x.nr, nc:x.nc });

      <div class="card flat"><div class="muted">Electricity per year</div><div class="big">${nf(E.annual)} units</div><div class="muted">≈ ${nf(E.annual / 12)} units per month</div></div>
      ${c ? `<div class="card flat"><div class="muted">Saving in year 1</div><div class="big">${inr(c.y1)}</div><div class="muted">at ₹${S0.cost.tariff} per unit</div></div>
      <div class="card flat"><div class="muted">Your cost after subsidy</div><div class="big">${inrShort(c.net)}</div><div class="muted">incl. GST${c.subsidy ? `, subsidy ${inr(c.subsidy)}` : ''}</div></div>
      <div class="card flat"><div class="muted">Money back in</div><div class="big">${c.payback != null ? nf(c.payback, 1) + ' years' : '—'}</div><div class="muted">${S0.cost.years}-year savings ${inrShort(c.cum25)}</div></div>` : ''}
      <div class="card flat"><div class="muted">CO₂ avoided</div><div class="big">${nf(co2, 1)} t/yr</div><div class="muted">≈ ${nf(co2 * 45)} trees planted</div></div></div>
    <h2>What you get</h2><ul>${bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
    <div id="custChart">${chartHTML('chMonthlyC', 'Expected monthly generation (units / kWh)', 'Lower in the monsoon months, highest in March–May')}</div>
    <h2>Good to know</h2><ul><li>Clean the panels with plain water every 1–2 weeks in dry, dusty months (early morning).</li><li>Net-metering lets you use solar units against your electricity bill — the installer will apply to your DISCOM.</li><li>Generation figures are estimates based on typical weather; actual output varies year to year.</li></ul>
    <div class="disc"><b>Disclaimer:</b> ${DISCLAIMER}</div></div>`;
  return { html, after: el => drawChart($('#chMonthlyC', el), { type:'bar', x: MONTHS, series:[{ name:'Units', color:'#2a78d6', data: E.months.map(m => m.kwh) }], yLabel:'kWh' }) };
}
function printReport(kind) {
  if (!R) return;
  const area = $('#printArea'), snap = screenshotPNG();
  const rep = kind === 'eng' ? engReportHTML(R, snap) : custReportHTML(R, snap);
  if (HOSTED) {   // printing is not possible inside a Claude artifact → show the report on the page
    openModal(kind === 'eng' ? 'Engineering calculation report' : 'Customer summary',
      `<p class="note">Printing / “Save as PDF” is not available inside Claude. To get a PDF, open the offline copy of this tool (index.html) in Chrome or Edge, load the same design (Design ▾ → Export here, Import there) and use Reports → Save as PDF.</p>${rep.html}`, true);
    try { rep.after($('#modalBody')); } catch (e) { console.error(e); }
    $('#modalBody').scrollTop = 0;
    return;
  }
  area.innerHTML = rep.html;
  area.style.cssText = 'display:block;position:fixed;left:-20000px;top:0;width:980px';
  try { rep.after(area); } catch (e) { console.error(e); }
  $$('canvas', area).forEach(cv => { const img = new Image(); img.src = cv.toDataURL('image/png'); img.className = 'chartimg'; img.style.width = '100%'; cv.replaceWith(img); });
  area.style.cssText = '';
  setTimeout(() => window.print(), 120);
}

/* ---------- Presentation overlay ---------- */
function renderPres() {
  if (!R) return;
  const c = R.cost;
  $('#presOverlay').innerHTML = `<h2>${esc(S.project.client || S.project.name)}</h2><div class="muted">${esc(S.project.site)}</div><div class="pk">
    <div><b>${nf(R.kWp, 2)} kW</b><span>${R.nModules} solar panels</span></div><div><b>${nf(R.energy.annual)}</b><span>units per year</span></div>
    ${c ? `<div><b>${inr(c.y1)}</b><span>saving in year 1</span></div><div><b>${c.payback != null ? nf(c.payback, 1) + ' yrs' : '—'}</b><span>payback</span></div>` : ''}
    <div><b>${nf(R.wind.Vzg * 3.6)} km/h</b><span>design wind speed</span></div><div><b>${R.it.frame === 'portal' ? S.install.clearH + ' m' : nf(R.layout.tilt, 0) + '°'}</b><span>${R.it.frame === 'portal' ? 'clear height below' : 'panel tilt'}</span></div></div>`;
}

/* ---------- Main loop & wiring ---------- */
let compTimer = null, skipAsmRender = false;
function scheduleCompute(delay = 250, fromAsm = false) { clearTimeout(compTimer); skipAsmRender = fromAsm; compTimer = setTimeout(runCompute, delay); }
function runCompute() {
  try { R = compute(S); }
  catch (e) { console.error(e); $('#tabBody').innerHTML = `<div class="warnbox fail"><b>Calculation error:</b> ${esc(e.message)}<br><span class="muted">Check the inputs; you can also reset assumptions or reload the demo from the Design menu.</span></div>`; return; }
  renderKPIs(); renderTabs();
  if (!(skipAsmRender && curTab === 'asm')) renderCurrentTab();
  skipAsmRender = false;
  refreshForm(); renderPres();
  try { buildScene(R); } catch (e) { console.error('3D build failed', e); }
  saveSoon();
}
function setupUI() {
  renderForm(); bindInputs($('#inputs'));
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; curTab = b.dataset.tab; renderTabs(); $('#tabBody').scrollTop = 0; renderCurrentTab(); });
  const sb = $('#sidebar'), small = () => window.matchMedia('(max-width: 900px)').matches;
  if (small()) sb.classList.remove('open');
  $('#btnSidebar').onclick = () => { if (small()) sb.classList.toggle('open'); else { sb.classList.toggle('collapsed'); setTimeout(() => { resize3D(); renderCurrentTab(); }, 220); } };
  // menus
  const menus = [['#btnReports', '#menuReports'], ['#btnFile', '#menuFile']];
  for (const [b, m] of menus) $(b).onclick = e => { e.stopPropagation(); const open = $(m).classList.contains('open'); $$('.menu-pop').forEach(x => x.classList.remove('open')); if (!open) $(m).classList.add('open'); };
  document.addEventListener('click', () => $$('.menu-pop').forEach(x => x.classList.remove('open')));
  $$('#menuReports [data-report]').forEach(b => b.onclick = () => printReport(b.dataset.report));
  $('#btnExport').onclick = () => download((S.project.name || 'pv-design').replace(/[^\w-]+/g, '_') + '.json', JSON.stringify(S, null, 2), 'application/json');
  $('#btnImport').onclick = () => $('#fileImport').click();
  $('#fileImport').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { S = normaliseState(JSON.parse(rd.result)); renderForm(); syncSunUI(); V.first = true; runCompute(); } catch (err) { messageBox('Import failed', 'Could not read this design file: ' + err.message + '. Choose a .json file exported from this tool.'); } };
    rd.readAsText(f); e.target.value = '';
  };
  $('#btnDemo').onclick = async () => { if (!(await confirmBox('Replace the current design with the Jaipur 5 kWp demo?', 'Load demo'))) return; S = demoState(); renderForm(); syncSunUI(); V.first = true; runCompute(); };
  $('#btnNew').onclick = async () => {
    if (!(await confirmBox('Start a new blank design? Your assumptions are kept; the current inputs are replaced.', 'Start new design'))) return;
    const A = S.A; S = demoState(); S.A = A;
    Object.assign(S.project, { name:'New design', client:'', site:'' }); Object.assign(S.install, { type:'rcc_std', obstacles:[], foundation:'pedestal_dw', roofL:15, roofW:10, roofCap:0, sanctioned:0 }); S.system.target = 0;
    renderForm(); V.first = true; runCompute();
  };
  $('#btnResetA').onclick = resetAssumptions;
  $('#btnOptimize').onclick = openOptimizer;
  $('#modalClose').onclick = closeModal; $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
  // 3D controls
  $('#camBtns').onclick = e => { const b = e.target.closest('[data-cam]'); if (b) setCam(b.dataset.cam); };
  $('#viewToggles').onclick = e => {
    const b = e.target.closest('[data-tg]'); if (!b) return;
    V.tg[b.dataset.tg] = !V.tg[b.dataset.tg]; b.classList.toggle('on', V.tg[b.dataset.tg]); applyToggles();
  };
  $('#btnPng').onclick = () => { const d = screenshotPNG(); if (d) download((S.project.name || 'pv-design').replace(/[^\w-]+/g, '_') + '_3D.png', d); };
  $('#btnFull').onclick = () => {
    const w = $('#viewWrap');
    if (document.fullscreenElement) document.exitFullscreen();
    else if (w.requestFullscreen) w.requestFullscreen().catch(() => w.classList.toggle('presenting'));
    else w.classList.toggle('presenting');
  };
  document.addEventListener('fullscreenchange', () => { const on = !!document.fullscreenElement; $('#viewWrap').classList.toggle('presenting', on); if (on) setCam('show'); setTimeout(resize3D, 100); });
  // sun sliders
  syncSunUI();
  $('#sunDay').oninput = e => { S.view.day = +e.target.value; updateSun(); saveSoon(); };
  $('#sunHour').oninput = e => { S.view.hour = +e.target.value; updateSun(); saveSoon(); };
  // splitter
  const sp = $('#splitter'), vw = $('#viewWrap');
  sp.addEventListener('pointerdown', e => {
    e.preventDefault(); sp.setPointerCapture(e.pointerId);
    const main = $('main').getBoundingClientRect();
    const move = ev => { const h = clamp(ev.clientY - main.top, 180, main.height - 160); vw.style.flex = `0 0 ${h}px`; resize3D(); };
    const up = () => { sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); renderCurrentTab(); };
    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up);
  });
  let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (curTab === 'energy' || curTab === 'cost') renderCurrentTab(); }, 250); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#memberPop').hidden = true; } });
}
function syncSunUI() { $('#sunDay').value = S.view.day; $('#sunHour').value = S.view.hour; updateSun(); }

/* ---------- Boot ---------- */
setupUI();
runCompute();
init3D().then(ok => { if (ok && R) { buildScene(R); updateSun(); } });
</script>
</body>
</html>
